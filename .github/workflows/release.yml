name: Release
on:
  push:
    tags: ["v*"]
# read by default; only the job that publishes gets write access
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # publish the release
      id-token: write       # sign the build attestation
      attestations: write   # store it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: System libraries
        timeout-minutes: 5
        run: |
          o='-o Acquire::Retries=5 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15'
          sudo apt-get $o update && sudo apt-get $o install -y libxkbcommon-dev libwayland-dev libvulkan-dev libfontconfig1-dev libdbus-1-dev pkg-config
      - run: cargo build --release --locked
      - run: cargo test --release --locked
      - name: Package the release files (the same script the rehearsal test runs)
        run: bash packaging/build-release.sh "${GITHUB_REF_NAME#v}" .
      - name: Attest where these files came from
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            hestia-linux-x86_64.tar.gz
            hestia_*_amd64.deb
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            hestia-linux-x86_64.tar.gz
            hestia-linux-x86_64.tar.gz.sha256
            hestia_*_amd64.deb
            hestia_*_amd64.deb.sha256
