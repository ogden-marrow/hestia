name: CI
on:
  push:
    branches: [main]
  pull_request:
env:
  CARGO_TERM_COLOR: always
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        timeout-minutes: 5
        run: |
          o='-o Acquire::Retries=5 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15'
          sudo apt-get $o update && sudo apt-get $o install -y libxkbcommon-dev libwayland-dev libvulkan-dev libfontconfig1-dev libdbus-1-dev pkg-config
      - run: cargo build --release --locked
      - run: cargo test --release --locked
      - name: Clipboard extension never records secrets
        run: node tests/clipboard-filter.js
      - name: Bootstrap restores a machine safely
        run: bash tests/bootstrap.sh
      - name: Watcher on a fresh home repository
        run: bash tests/watcher.sh
