# cargo-deny: where our dependencies may come from, and known vulnerabilities.
[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# the UI toolkit, pinned to an exact revision in Cargo.lock
allow-git = ["https://github.com/anomalyco/rune"]
